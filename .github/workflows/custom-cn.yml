name: Generate Custom CN Playlist

on:
  # 监听 master 分支更新（无论手动推送还是上游同步，都会触发）
  push:
    branches:
      - master
  schedule:
    # 每天 UTC 01:00（北京时间 9:00，在上游同步后）自动运行
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 执行分类提取脚本
        run: python build_cn.py

      - name: 提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cn_custom.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate classified cn_custom.m3u" && git push)
