name: Generate Custom CN Playlist

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出 master 分支代码
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖包
        run: pip install requests

      - name: 执行分类脚本
        run: python build_cn.py

      - name: 自动提交并推送到 master 分支
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate classified cn_custom.m3u"
          branch: master
          file_pattern: "cn_custom.m3u"
