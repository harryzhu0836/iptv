name: Generate Custom CN Playlist

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 执行分类提取脚本
        run: python build_cn.py

      - name: 提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cn_custom.m3u
          
          # 判断是否有改动，有改动才提交，防止无改动提交触发 128 报错
          if ! git diff --staged --quiet; then
            git commit -m "Auto-generate classified cn_custom.m3u"
            git push
          else
            echo "文件内容无变化，无需提交。"
          fi
